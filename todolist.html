<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <style>
    .done {
      text-decoration: line-through;
      color: green;
    }
  </style>
</head>
<body>
  <h1>To Do List</h1>
  <input type="text" id="taskInput" placeholder="Add a task" />
  <button onclick="addTask()">Add</button>
  <ul id="taskList"></ul>

  <script>
    function addTask() {
      const taskText = getTaskText();
      if (taskText) {
        addTaskItem(taskText);
      } else {
        console.log("No task entered");
      }
    }

    function getTaskText() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      input.value = ""; // clear input after adding
      return text;
    }

    function addTaskItem(taskText) {
      const taskList = document.getElementById("taskList");
      const li = document.createElement("li");

      const taskSpan = document.createElement("span");
      taskSpan.textContent = taskText;

      li.appendChild(taskSpan);
      li.appendChild(createDoneButton(taskSpan));
      li.appendChild(createEditBtn(taskSpan));
      li.appendChild(createDeleteBtn(li));

      taskList.appendChild(li);
    }

    function createDeleteBtn(li) {
      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "X";
      deleteBtn.className = "delete-btn";
      deleteBtn.style.marginLeft = "8px";
      deleteBtn.style.backgroundColor = "#FF0000";
      deleteBtn.style.color = "white";
      deleteBtn.onclick = () => handleDeleteClick(li);
      return deleteBtn;
    }

    function handleDeleteClick(li) {
      console.log("Task deleted ->", li.textContent.replace("X", "").trim(), Date());
      li.remove();
    }

    function createEditBtn(taskSpan) {
      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.style.marginLeft = "8px";
      editBtn.onclick = () => {
        const newText = prompt("Edit your task:", taskSpan.textContent);
        if (newText !== null && newText.trim() !== "") {
          taskSpan.textContent = newText.trim();
        }
      };
      return editBtn;
    }

    function createDoneButton(taskSpan) {
      const doneBtn = document.createElement("button");
      doneBtn.textContent = "Done";
      doneBtn.style.marginLeft = "8px";
      doneBtn.onclick = () => {
        taskSpan.classList.add("done");
        const li = taskSpan.parentElement;
        const buttons = li.querySelectorAll("button");
        buttons.forEach(btn => btn.remove());
        console.log("Task complete ->", taskSpan.textContent, Date());
      };
      return doneBtn;
    }
  </script>
</body>
</html>
